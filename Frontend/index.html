<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#F4F4F5" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#09090B" />
    <meta
      name="description"
      content="TRUSS; çoklu-kiracı izolasyonu, KM/SMH sayaç kronolojisi, dijital zimmet muayenesi, otomatik iş emri ve imzalı belge kasası sunan B2B kurumsal filo ve varlık yönetimi platformudur."
    />
    <meta name="robots" content="index, follow" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="tr_TR" />
    <meta property="og:title" content="TRUSS — Kurumsal Filo & Varlık Yönetimi Platformu" />
    <meta
      property="og:description"
      content="Çoklu-kiracı kurumsal filo yönetimi: KM/SMH kronolojisi, TCO/yakıt anomali analizi, fotoğraflı dijital zimmet ve imzalı belge kasası."
    />
    <meta name="twitter:card" content="summary" />
    <link rel="apple-touch-icon" href="/logo192.png" />
    <link rel="manifest" href="/manifest.json" />
    <title>TRUSS — Kurumsal Filo &amp; Varlık Yönetimi Platformu</title>
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('vite-ui-theme');
          var theme = stored || 'dark';
          var resolved =
            theme === 'system'
              ? window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light'
              : theme === 'light'
                ? 'light'
                : 'dark';
          var root = document.documentElement;
          root.classList.remove('light', 'dark');
          root.classList.add(resolved);
          root.setAttribute('data-theme', resolved);
          root.style.colorScheme = resolved;
        } catch (_e) {}
      })();
    </script>
  </head>
  <body>
    <noscript>Bu uygulamayı çalıştırmak için JavaScript etkinleştirilmelidir.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/index.js"></script>
  </body>
</html>
